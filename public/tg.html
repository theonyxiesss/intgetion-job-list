<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INTGETION JOB LIST</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        function read() {
          var init = "";
          try {
            var h = location.hash || "";
            if (h.indexOf("tgWebAppData") !== -1) {
              sessionStorage.setItem("tg_web_app_hash", h);
              var body = h.replace(/^#/, "");
              var q = body.indexOf("?");
              if (q >= 0) body = body.slice(q + 1);
              init = new URLSearchParams(body).get("tgWebAppData") || "";
            }
            var w = window.Telegram && window.Telegram.WebApp;
            if (w && typeof w.ready === "function") w.ready();
            if (w && w.initData) {
              sessionStorage.setItem("tg_web_app_init", w.initData);
              init = w.initData;
            }
            if (!init) {
              var search = location.search || "";
              if (search.indexOf("tgWebAppData") !== -1) {
                init = new URLSearchParams(search).get("tgWebAppData") || "";
              }
            }
            if (!init) init = sessionStorage.getItem("tg_web_app_init") || "";
          } catch (e) {}
          return init;
        }
        function locale() {
          var l = "en";
          try {
            var g = navigator.language || "";
            if (/^ru\b/i.test(g)) l = "ru";
            else if (/^es\b/i.test(g)) l = "es";
          } catch (e) {}
          return l;
        }
        function claim(init) {
          try {
            var h = 0;
            for (var i = 0; i < init.length; i++)
              h = (h * 31 + init.charCodeAt(i)) | 0;
            var k = "tg_mini_try_" + (h >>> 0).toString(16);
            var raw = Number(sessionStorage.getItem(k) || "0");
            var used = isFinite(raw) && raw > 0 ? raw : 0;
            if (used >= 2) return false;
            sessionStorage.setItem(k, String(used + 1));
            return true;
          } catch (e) {
            return true;
          }
        }
        function post(init) {
          if (!claim(init)) return false;
          var f = document.createElement("form");
          f.method = "POST";
          f.action = "/api/auth/telegram/miniapp";
          function field(name, value) {
            var i = document.createElement("input");
            i.type = "hidden";
            i.name = name;
            i.value = value;
            f.appendChild(i);
          }
          field("initData", init);
          field("locale", locale());
          field("framed", "0");
          (document.body || document.documentElement).appendChild(f);
          f.submit();
          return true;
        }
        function guest() {
          var l = locale();
          var s = location.search || "";
          s += (s ? "&" : "?") + "tgb=1";
          location.replace(
            (l === "en" ? "/" : "/" + l) + s + (location.hash || ""),
          );
        }
        var n = 0;
        function tick() {
          var init = read();
          if (init) {
            if (!post(init)) guest();
            return;
          }
          if (n++ >= 50) guest();
          else setTimeout(tick, 100);
        }
        tick();
      })();
    </script>
  </head>
  <body></body>
</html>
