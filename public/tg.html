<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INTGETION JOB LIST</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        function stash() {
          try {
            var h = location.hash || "";
            if (h.indexOf("tgWebAppData") !== -1) {
              sessionStorage.setItem("tg_web_app_hash", h);
            }
            var w = window.Telegram && window.Telegram.WebApp;
            if (w && typeof w.ready === "function") w.ready();
            if (w && w.initData)
              sessionStorage.setItem("tg_web_app_init", w.initData);
          } catch (e) {}
        }
        function go() {
          stash();
          var locale = "en";
          try {
            var lang = navigator.language || "";
            if (/^ru\b/i.test(lang)) locale = "ru";
            else if (/^es\b/i.test(lang)) locale = "es";
          } catch (e) {}
          // D335: English is the root; `tgb=1` tells the proxy not to bounce
          // again. No HTTP redirect, so the #tgWebAppData fragment survives.
          var search = location.search || "";
          search += (search ? "&" : "?") + "tgb=1";
          location.replace(
            (locale === "en" ? "/" : "/" + locale) +
              search +
              (location.hash || ""),
          );
        }
        var n = 0;
        function tick() {
          stash();
          var w = window.Telegram && window.Telegram.WebApp;
          var ready =
            (location.hash || "").indexOf("tgWebAppData") !== -1 ||
            !!(w && w.initData);
          if (ready || n++ >= 50) go();
          else setTimeout(tick, 100);
        }
        tick();
      })();
    </script>
  </head>
  <body></body>
</html>
