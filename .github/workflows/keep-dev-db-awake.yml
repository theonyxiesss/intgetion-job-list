name: Keep dev database awake

# The free Supabase project behind intgetion-dev pauses after a week without
# activity; one query a day keeps it up for local work and agents.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ping intgetion-dev
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: node scripts/ping-db.mjs
